<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANODEOBRA – Consultar Existencias</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --azul:#3860b2;--azul-d:#00126b;
  --naranja:#c05621;--naranja-d:#7c2d12;
  --borde:#e2e8f0;--rojo:#e53e3e;--verde:#2e9e4f;--amarillo:#d69e2e;
  --fondo:#f0f4fb;--shadow:0 2px 16px rgba(0,18,107,0.10)
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--fondo);min-height:100vh}

/* TOPBAR */
.topbar{background:var(--azul-d);color:white;display:flex;align-items:center;padding:0 20px;height:58px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,18,107,0.35);gap:12px}
.tb-logo{font-family:'Space Mono',monospace;font-weight:700;font-size:13px;letter-spacing:2px;color:white;flex:1}
.btn-back{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);color:white;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s}
.btn-back:hover{background:rgba(255,255,255,0.22)}
.tb-user{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;color:rgba(255,255,255,.9)}

.page{max-width:820px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:16px}
.card{background:white;border:1.5px solid var(--borde);border-radius:16px;padding:18px;box-shadow:var(--shadow)}

/* BUSCADOR */
.searchbox{position:relative}
.search-input{width:100%;padding:14px 16px 14px 44px;border:2px solid var(--borde);border-radius:12px;font-size:15px;font-family:'DM Sans',sans-serif;transition:all .2s;background:white}
.search-input:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(56,96,178,.15)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:#94a3b8}
.search-hint{font-size:11px;color:#718096;margin-top:8px;text-align:center;font-family:'Space Mono',monospace}
.search-hint strong{color:var(--azul)}

/* RESULTADOS */
.results{display:flex;flex-direction:column;gap:10px}
.article{background:white;border:1.5px solid var(--borde);border-radius:14px;overflow:hidden;transition:all .15s}
.article.expanded{border-color:var(--azul);box-shadow:0 4px 20px rgba(56,96,178,.15)}
.article-head{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:background .15s}
.article-head:hover{background:#f8fafc}
.article.expanded .article-head{background:linear-gradient(90deg,rgba(56,96,178,.06),rgba(56,96,178,.02))}
.article-code{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--azul-d);background:#e0e7ff;border:1px solid #c7d2fe;border-radius:6px;padding:4px 10px;white-space:nowrap;flex-shrink:0}
.article-desc{flex:1;font-size:14px;color:#1a202c;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.article-total{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--verde);background:#DCFCE7;border:1px solid #BBF7D0;border-radius:6px;padding:4px 10px;white-space:nowrap;flex-shrink:0}
.article-total.zero{color:#94a3b8;background:#f1f5f9;border-color:#e2e8f0}
.article-arrow{color:#94a3b8;font-size:14px;transition:transform .2s;flex-shrink:0}
.article.expanded .article-arrow{transform:rotate(180deg);color:var(--azul)}

/* DETALLE: BODEGAS */
.article-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.article.expanded .article-body{max-height:1000px}
.bodegas-wrap{padding:0 18px 18px}
.bodegas-title{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;color:var(--azul);text-transform:uppercase;letter-spacing:1.2px;margin:14px 0 10px;padding-top:12px;border-top:1.5px dashed #cbd5e0}
.bodegas-grid{display:flex;flex-direction:column;gap:8px}
.bodega{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:12px;align-items:center;padding:12px 14px;background:#f8fafc;border:1.5px solid var(--borde);border-radius:10px;transition:all .15s;cursor:pointer}
.bodega:hover{border-color:var(--verde);background:#f0fdf4;transform:translateX(2px)}
.bodega.selected{border-color:var(--verde);background:#DCFCE7}
.bod-cen{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:var(--naranja-d);background:#FFEDD5;border:1px solid #FED7AA;border-radius:6px;padding:3px 8px}
.bod-alm{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:#1e40af;background:#dbeafe;border:1px solid #bfdbfe;border-radius:6px;padding:3px 8px}
.bod-lbl{font-size:12px;color:#64748b}
.bod-lbl strong{color:#1a202c;font-weight:600}
.bod-cant{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;color:var(--verde);text-align:right;min-width:60px}
.bod-um{font-size:11px;color:#64748b;font-weight:600;text-transform:uppercase}

/* SIN RESULTADOS */
.empty{padding:36px 20px;text-align:center;color:#94a3b8}
.empty-icon{font-size:42px;margin-bottom:10px;opacity:.5}
.empty-title{font-size:15px;font-weight:600;color:#64748b;margin-bottom:4px}
.empty-hint{font-size:12px}

/* CONTADOR */
.count-bar{font-size:12px;color:#718096;font-family:'Space Mono',monospace;text-align:center;padding:8px}

/* SIN STOCK EN EL ARTÍCULO */
.no-stock{padding:20px;text-align:center;color:#94a3b8;font-size:13px}
.no-stock-icon{font-size:32px;margin-bottom:6px}

/* NOTIF */
.notif{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#2d3748;color:white;padding:12px 22px;border-radius:12px;font-size:13px;font-weight:600;z-index:9999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);max-width:90vw;text-align:center}
.notif.show{transform:translateX(-50%) translateY(0)}
.notif.success{background:var(--verde)}.notif.error{background:var(--rojo)}

/* SPINNER */
.spinner{display:flex;justify-content:center;padding:30px}
.spin{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:var(--azul);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .bodega{grid-template-columns:auto auto 1fr;gap:8px;padding:10px 12px}
  .bod-cant{grid-column:1 / -1;text-align:right;padding-top:4px;border-top:1px dashed #cbd5e0;margin-top:6px}
  .bod-um{display:none}
  .article-desc{font-size:13px}
}
</style>
</head>
<body>

<div class="topbar">
  <button class="btn-back" onclick="regresar()">← Menú</button>
  <div class="tb-logo">CONSULTAR EXISTENCIAS</div>
  <div class="tb-user" id="tb-user">—</div>
</div>

<div class="page">

  <!-- BUSCADOR -->
  <div class="card">
    <div class="searchbox">
      <span class="search-icon">🔍</span>
      <input type="text" id="q" class="search-input" placeholder="Buscar por código o descripción…" autocomplete="off">
    </div>
    <div class="search-hint">Escribe al menos <strong>3 caracteres</strong> — código de material o palabra clave</div>
  </div>

  <div class="count-bar" id="count-bar" style="display:none"></div>

  <!-- RESULTADOS -->
  <div id="results-wrap"></div>

</div>

<div id="notif" class="notif"></div>

<script>
let userActual = null;
let timer = null;
let seleccionado = null; // {material, centro, almacen, cantidad, um, descripcion}

window.onload = () => {
  userActual = getSession();
  if (!userActual) { window.location.href='index.html'; return; }
  document.getElementById('tb-user').textContent = userActual.nombre;
  document.getElementById('q').addEventListener('input', onSearch);
  document.getElementById('q').focus();
};

function regresar(){
  const rol = (userActual?.rol||'').toUpperCase();
  const m = {SUPERVISOR:'menu_supervisor.html',CCT:'menu_cct.html',JEFE:'menu_jefe.html',PLANNER:'menu_planner.html'};
  window.location.href = m[rol] || 'menu_mecanico.html';
}

function onSearch(){
  clearTimeout(timer);
  const q = document.getElementById('q').value.trim();
  if (q.length < 3){
    document.getElementById('results-wrap').innerHTML = '';
    document.getElementById('count-bar').style.display = 'none';
    return;
  }
  timer = setTimeout(() => buscar(q), 300);
}

async function buscar(q){
  const wrap = document.getElementById('results-wrap');
  wrap.innerHTML = '<div class="spinner"><div class="spin"></div></div>';
  document.getElementById('count-bar').style.display = 'none';

  try{
    // Buscamos por Material (código) o por Descripcion (texto)
    // Usamos or= para combinar ambos, y con ilike para case-insensitive
    const qEsc = encodeURIComponent(q);
    const url = `/api/supa/rest/v1/Existencias?or=(Material.ilike.*${qEsc}*,Descripcion.ilike.*${qEsc}*)&order=Material.asc&limit=500`;
    const r = await fetch(url, {
      headers:{ apikey:SUPA_KEY, Authorization:'Bearer '+SUPA_KEY }
    });
    if (!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();

    if (!data.length){
      wrap.innerHTML = `
        <div class="card empty">
          <div class="empty-icon">🔍</div>
          <div class="empty-title">Sin resultados</div>
          <div class="empty-hint">No hay artículos que coincidan con "${escapeHtml(q)}"</div>
        </div>`;
      return;
    }

    // Agrupar por Material
    const grupos = {};
    data.forEach(row => {
      const key = row.Material;
      if (!grupos[key]){
        grupos[key] = {
          Material: row.Material,
          Descripcion: row.Descripcion || '(sin descripción)',
          UM: row.UM || '',
          bodegas: []
        };
      }
      grupos[key].bodegas.push({
        Centro: row.Centro || '',
        Almacen: row.Almacen || '',
        Cantidad: Number(row.Cantidad) || 0,
        UM: row.UM || ''
      });
    });

    const articulos = Object.values(grupos);

    // Ordenar bodegas de cada uno por cantidad descendente
    articulos.forEach(a => {
      a.bodegas.sort((x,y) => y.Cantidad - x.Cantidad);
      a.TotalStock = a.bodegas.reduce((s,b) => s + b.Cantidad, 0);
    });

    // Ordenar artículos: primero los que tengan stock
    articulos.sort((a,b) => (b.TotalStock>0?1:0) - (a.TotalStock>0?1:0));

    document.getElementById('count-bar').style.display = 'block';
    document.getElementById('count-bar').textContent = `${articulos.length} artículo(s) encontrado(s)`;

    wrap.innerHTML = `<div class="results">${articulos.map((a,idx) => renderArticulo(a, idx)).join('')}</div>`;

  } catch(e){
    wrap.innerHTML = `<div class="card empty"><div class="empty-icon">⚠️</div><div class="empty-title">Error al consultar</div><div class="empty-hint">${escapeHtml(e.message)}</div></div>`;
  }
}

function renderArticulo(a, idx){
  const conStock = a.bodegas.filter(b => b.Cantidad > 0);
  const totalStr = a.TotalStock > 0 ? `${fmt(a.TotalStock)} ${a.UM}` : 'Sin stock';
  const totalCls = a.TotalStock > 0 ? '' : 'zero';

  const bodegasHtml = conStock.length ? conStock.map(b => `
    <div class="bodega" onclick='seleccionarBodega(${JSON.stringify({
      material:a.Material, descripcion:a.Descripcion,
      centro:b.Centro, almacen:b.Almacen,
      cantidad:b.Cantidad, um:b.UM
    }).replace(/'/g,"&apos;")})'>
      <div class="bod-cen">C: ${escapeHtml(b.Centro)}</div>
      <div class="bod-alm">A: ${escapeHtml(b.Almacen)}</div>
      <div class="bod-lbl">Bodega <strong>${escapeHtml(b.Centro)}</strong> · Almacén <strong>${escapeHtml(b.Almacen)}</strong></div>
      <div class="bod-cant">${fmt(b.Cantidad)}</div>
      <div class="bod-um">${escapeHtml(b.UM)}</div>
    </div>`).join('')
    : `<div class="no-stock"><div class="no-stock-icon">📭</div>Este material no tiene existencias disponibles en ninguna bodega.</div>`;

  return `
    <div class="article" id="art-${idx}">
      <div class="article-head" onclick="toggleArt(${idx})">
        <div class="article-code">${escapeHtml(a.Material)}</div>
        <div class="article-desc" title="${escapeHtml(a.Descripcion)}">${escapeHtml(a.Descripcion)}</div>
        <div class="article-total ${totalCls}">${totalStr}</div>
        <div class="article-arrow">▼</div>
      </div>
      <div class="article-body">
        <div class="bodegas-wrap">
          <div class="bodegas-title">Disponibilidad por bodega</div>
          <div class="bodegas-grid">${bodegasHtml}</div>
        </div>
      </div>
    </div>`;
}

function toggleArt(idx){
  // Cerrar los demás, abrir/cerrar el actual
  const clicked = document.getElementById('art-'+idx);
  const isOpen = clicked.classList.contains('expanded');
  document.querySelectorAll('.article').forEach(el => el.classList.remove('expanded'));
  if (!isOpen) clicked.classList.add('expanded');
}

function seleccionarBodega(info){
  seleccionado = info;
  // Marcar visualmente
  document.querySelectorAll('.bodega').forEach(el => el.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  notify(`✓ Seleccionado: ${info.material} — Bodega ${info.centro} / Almacén ${info.almacen}`,'success');
  // Aquí en el futuro podríamos: pasar a reservas.html con esta info, guardar en sessionStorage, etc.
}

function fmt(n){
  if (n === undefined || n === null) return '';
  return Number(n).toLocaleString('es-GT',{maximumFractionDigits:3});
}
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

let nTO;
function notify(msg, type='info'){
  const el = document.getElementById('notif');
  el.textContent = msg; el.className = 'notif '+type;
  void el.offsetWidth; el.classList.add('show');
  clearTimeout(nTO); nTO = setTimeout(() => el.classList.remove('show'), 4000);
}
</script>
</body>
</html>
